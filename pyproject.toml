[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ee5239-collision-optim"
version = "0.1.0"
description = "Active reflection and contact-driven hybrid optimization prototypes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
benchmark = ["torch>=2.0"]

[project.scripts]
collision-smoke = "collision_optim.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

